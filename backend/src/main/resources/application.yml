spring:
  application:
    name: ishopping-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ishopping}
    username: ${POSTGRES_USER:ishopping}
    password: ${POSTGRES_PASSWORD}
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

ishopping:
  jwt:
    segredo: ${JWT_SECRET:}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  admin:
    username: ${ADMIN_USERNAME:}
    nome: ${ADMIN_NOME:}
    password: ${ADMIN_PASSWORD:}
